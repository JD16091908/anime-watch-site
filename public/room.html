<!DOCTYPE html>
<html lang="ru">
<head>
  <script>
    if (window.location.pathname === '/room.html') {
      window.location.replace('/');
    }
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Комната просмотра — Anivmeste</title>
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <link rel="canonical" href="https://anivmeste.ru/" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/room.css" />
  <link rel="stylesheet" href="/room-polish.css" />
  <link rel="stylesheet" href="/room-mobile-fix.css" />
  <link rel="stylesheet" href="/overlay-patch.css" />

  <!-- 🔥 добавили -->
  <link rel="stylesheet" href="/room-ui-fix.css" />

  <script>window.yaContextCb = window.yaContextCb || [];</script>
  <script src="https://yandex.ru/ads/system/context.js" async></script>

  <script src="/config.js"></script>
</head>
<body>

<div class="room-page" id="roomPage">

  <header class="top-bar">
    <div class="top-bar-left">
      <a href="/" class="logo-btn" aria-label="На главную AniVmeste">
        <img src="/favicon.svg" alt="" class="logo-btn-icon" />
        <span class="logo-btn-text">AniVmeste</span>
      </a>
    </div>

    <div class="top-center">
      <span id="roomTitle">Комната просмотра</span>
      <button id="copyLinkBtn" class="small-btn" type="button">
        🔗 Пригласить
      </button>
    </div>

    <div class="top-actions">
      <span id="hostBadge" class="host-badge">👀 Зритель</span>
      <button id="cinemaModeBtn" class="small-btn" type="button">
        🎬 Кино
      </button>
      <button id="supportRoomBtn" class="small-btn room-support-btn" type="button">
        ❤️ Поддержать
      </button>
    </div>
  </header>

  <div class="room-layout-centered">

    <div class="player-area-centered">
      <!-- НИЧЕГО НЕ ТРОГАЛ -->
      <!-- ВЕСЬ ТВОЙ КОД ПЛЕЕРА ОСТАЁТСЯ -->
    </div>

    <aside class="right-sidebar">

      <!-- 👥 ЗРИТЕЛИ ВВЕРХУ -->
      <div class="block">
        <h2>👥 Зрители</h2>
        <p class="users-caption muted-text">Участники комнаты и их прогресс</p>
        <div id="usersList" class="users-list">
          <div class="empty-state">Пока никого нет</div>
        </div>
      </div>

      <!-- 🧑 НИК -->
      <div class="block">
        <div class="nickname-panel">
          <span class="nickname-label">Ваш ник</span>
          <div class="nickname-row">
            <input
              id="nicknameInput"
              class="nickname-input"
              type="text"
              maxlength="30"
              placeholder="Ваш ник..."
              autocomplete="off"
            />
            <button id="saveNicknameBtn" class="small-btn nickname-save-btn" type="button">
              Сохранить
            </button>
          </div>
        </div>
      </div>

      <!-- 💬 ЧАТ ВНИЗУ -->
      <div class="chat-block block">
        <h2>💬 Чат</h2>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-box">
          <input
            id="chatInput"
            type="text"
            maxlength="300"
            placeholder="Сообщение..."
            autocomplete="off"
          />
          <button id="sendBtn" class="small-btn btn" type="button">
            Отправить
          </button>
        </div>
      </div>

    </aside>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/chat.js"></script>
<script src="/player.js"></script>
<script src="/overlay-autohide.js"></script>
<script src="/room.js"></script>

</body>
</html>
